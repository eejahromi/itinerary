<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kyoto — Japan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,640&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body style="--accent: var(--kyoto)">
  <main class="wrap">
    <div class="topbar">
      <a class="brand" href="index.html">Japan</a>
      <a class="back" href="index.html">All cities</a>
    </div>

    <header class="city-head">
      <div>
        <p>03</p>
        <h1>Kyoto</h1>
      </div>
    </header>

    <article class="place" id="kinkakuji">
      <h2><a href="https://www.google.com/search?q=Kinkaku-ji+Kyoto" target="_blank" rel="noopener noreferrer">Temple of Kinkakuji</a></h2>
      <figure>
        <a href="https://www.google.com/search?q=Kinkaku-ji+Kyoto" target="_blank" rel="noopener noreferrer">
          <img src="images/kinkakuji.jpg" alt="The gold pavilion of Kinkaku-ji beside the pond and pine trees">
        </a>
      </figure>
    </article>

    <article class="place" id="kiyomizu">
      <h2><a href="https://www.google.com/search?q=Kiyomizu+Temple+Kyoto" target="_blank" rel="noopener noreferrer">Kiyomizu Temple</a></h2>
      <figure>
        <a href="https://www.google.com/search?q=Kiyomizu+Temple+Kyoto" target="_blank" rel="noopener noreferrer">
          <img src="images/kiyomizu.jpg" alt="The wooden stage of Kiyomizu-dera above the trees">
        </a>
      </figure>
    </article>

    <article class="place place-pair" id="shizen">
      <h2><a href="https://www.google.com/search?q=%28THISIS%29SHIZEN+ice+cream+Kyoto" target="_blank" rel="noopener noreferrer">(THISIS)SHIZEN Ice Cream Shop</a></h2>
      <figure>
        <a class="photo-pair" href="https://www.google.com/search?q=%28THISIS%29SHIZEN+ice+cream+Kyoto" target="_blank" rel="noopener noreferrer">
          <img src="images/shizen.jpg" alt="Two flower-topped ice cream cones from (THISIS)SHIZEN">
          <img src="images/shizen2.jpg" alt="Flower and fruit ice cream cones from (THISIS)SHIZEN">
        </a>
      </figure>
    </article>

    <footer class="credits">
      <p>Photos</p>
      <ul>
        <li>Temple of Kinkakuji — Nacaru, CC BY-SA 4.0</li>
        <li>Kiyomizu Temple — Jordy Meow, CC BY-SA 3.0</li>
      </ul>
    </footer>

    <a class="page-back" href="index.html">Back to all cities</a>
